name: Build tagged gem

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          rubygems: '4.0.23'
      - name: Build the tagged gem
        id: package
        run: |
          set -euo pipefail
          filename="$(ruby -e '
            spec = Gem::Specification.load("sisyphus.gemspec")
            expected_tag = "v#{spec.version}"
            tag = ENV.fetch("GITHUB_REF_NAME")
            abort "Tag #{tag} must match #{expected_tag}" unless tag == expected_tag
            puts spec.file_name
          ')"
          mkdir -p pkg
          gem build sisyphus.gemspec --strict --output "pkg/$filename"
          printf 'archive=pkg/%s\n' "$filename" >> "$GITHUB_OUTPUT"
      - name: Check out the Medusa client
        uses: actions/checkout@v6
        with:
          repository: misasa/medusa_rest_client
          ref: refs/tags/1.5.2
          path: vendor/medusa_rest_client
          persist-credentials: false
      - name: Install the Medusa client
        working-directory: vendor/medusa_rest_client
        run: |
          gem build medusa_rest_client.gemspec --output "$RUNNER_TEMP/medusa_rest_client.gem"
          gem install --no-document "$RUNNER_TEMP/medusa_rest_client.gem"
      - name: Verify the installed gem
        env:
          GEM_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gem install --no-document --conservative "$GEM_ARCHIVE"
          ruby script/verify_package.rb "$GEM_ARCHIVE"
      - name: Upload the gem
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sisyphus-for-medusa-gem
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
