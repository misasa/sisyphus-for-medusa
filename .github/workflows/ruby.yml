name: Ruby

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.5.9'
            bundler: '2.3.27'
            rubygems: '3.3.27'
          - ruby: '2.6.10'
            bundler: '2.4.22'
            rubygems: '3.4.22'
          - ruby: '2.7.8'
            bundler: '2.4.22'
            rubygems: '3.4.22'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          rubygems: ${{ matrix.rubygems }}
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rspec
